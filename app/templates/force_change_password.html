<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Domain Ops Toolkit - 請先設定新密碼</title>
<style>
    body { font-family: "Microsoft JhengHei", sans-serif; background: #f2f2f2; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 360px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    .hint { font-size: 13px; color: #888; margin-bottom: 20px; }
    input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #f6821f; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:hover { background: #d96f14; }
    .error { color: #c0392b; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
    <div class="box">
        <h1>{{ username }}，請先設定新密碼</h1>
        <div class="hint">這是這個帳號第一次登入，必須先改一組只有你自己知道的密碼，才能繼續使用</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <input type="password" name="new_password" placeholder="新密碼（至少 8 個字元）" autofocus required autocomplete="new-password">
            <input type="password" name="confirm_password" placeholder="再輸入一次新密碼" required autocomplete="new-password">
            <button type="submit">設定新密碼</button>
        </form>
    </div>
</body>
</html>
