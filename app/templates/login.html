<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Domain Ops Toolkit - 登入</title>
<style>
    body { font-family: "Microsoft JhengHei", sans-serif; background: #f2f2f2; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 32px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
    h1 { font-size: 18px; margin-bottom: 20px; }
    input[type="text"], input[type="password"] { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 12px; font-size: 14px; }
    button { width: 100%; padding: 10px; background: #f6821f; color: #fff; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:hover { background: #d96f14; }
    .error { color: #c0392b; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
    <div class="box">
        <h1>Domain Ops Toolkit</h1>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            <input type="text" name="username" placeholder="帳號" autofocus required autocomplete="username">
            <input type="password" name="password" placeholder="密碼" required autocomplete="current-password">
            <button type="submit">登入</button>
        </form>
    </div>
</body>
</html>
